<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container with glow -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#4338ca" stroke-width="6" />

  <!-- Outer Speed Ring Accent -->
  <circle cx="256" cy="256" r="190" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="24 16" opacity="0.4" />

  <!-- Gear Wheel Behind -->
  <g opacity="0.25" stroke="url(#accentGrad)" stroke-width="12" fill="none">
    <circle cx="256" cy="256" r="130" />
    <path d="M256 106 L256 126 M256 386 L256 406 M106 256 L126 256 M386 256 L406 256" stroke-width="20" stroke-linecap="round" />
    <path d="M150 150 L164 164 M348 348 L362 362 M150 362 L164 348 M348 164 L362 150" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Crossed Mechanic Wrench -->
  <g filter="url(#glow)">
    <path d="M150 130 C165 110 195 110 215 125 L345 255 C355 265 355 280 345 290 L310 325 C300 335 285 335 275 325 L145 195 C130 175 130 145 150 130 Z" fill="url(#silverGrad)" />
    <!-- Wrench Head Open End -->
    <path d="M125 155 C120 140 125 120 140 110 C155 100 175 105 185 120 L160 145 Z" fill="#0f172a" />
    <circle cx="330" cy="310" r="14" fill="#0f172a" />
  </g>

  <!-- Modern Racing Car Silhouette -->
  <g transform="translate(0, 20)">
    <!-- Aerodynamic Car Body -->
    <path d="M110 290 C140 260 190 230 256 230 C330 230 380 265 410 290 C425 302 415 325 395 325 L125 325 C105 325 95 302 110 290 Z" fill="url(#accentGrad)" />
    <!-- Cabin & Windshield -->
    <path d="M190 255 C215 220 250 205 285 205 C320 205 345 225 365 255 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Speed Lines -->
    <path d="M80 325 L432 325" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" />
    <path d="M130 345 L382 345" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" opacity="0.6" />

    <!-- Headlight Beam -->
    <polygon points="390,285 450,270 450,305 390,295" fill="url(#goldGrad)" opacity="0.3" />

    <!-- Wheels -->
    <circle cx="165" cy="325" r="28" fill="#0f172a" stroke="url(#silverGrad)" stroke-width="8" />
    <circle cx="165" cy="325" r="10" fill="url(#goldGrad)" />
    <circle cx="355" cy="325" r="28" fill="#0f172a" stroke="url(#silverGrad)" stroke-width="8" />
    <circle cx="355" cy="325" r="10" fill="url(#goldGrad)" />
  </g>

  <!-- Spark Accent -->
  <path d="M256 120 L262 135 L277 141 L262 147 L256 162 L250 147 L235 141 L250 135 Z" fill="url(#goldGrad)" />
</svg>
